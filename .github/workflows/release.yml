name: Release

# Publica uma nova versão do app automaticamente:
#   1. Rode `npm version patch|minor|major` (atualiza package.json e cria tag v*)
#   2. `git push --tags`
#   3. Este workflow builda o instalador Windows e cria um GitHub Release.
#   4. O auto-update do jogo (electron-updater) encontra e instala a nova versão.
#
# Importante: o repositório precisa ser PÚBLICO (ou o app precisa de GH_TOKEN
# nas variáveis do app para acessar releases privados).

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    # Necessário: o electron-builder publica o instalador + latest.yml no
    # GitHub Releases. Sem esta permissão o GITHUB_TOKEN padrão é read-only
    # e a publicação falha com "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run content:export

      - run: npm run build

      # O electron-builder cria releases DRAFT por padrão e, se já existir um
      # draft para a tag, REUSA e mantém como draft — o auto-update não vê.
      # Deletamos o release anterior da tag (mantendo a tag) para garantir um
      # release PUBLICADO novo (releaseType: release no package.json).
      # shell: bash explícito — o padrão no Windows é o PowerShell, onde o
      # operador `||` não captura exit code de comando externo (o fallback
      # "sem release anterior" nunca rodava e o passo falhava na 1ª release
      # da tag, quando não há o que deletar).
      - name: Remover release anterior da tag (draft quebrado)
        shell: bash
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes 2>/dev/null || echo 'sem release anterior — ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar e publicar (GitHub Releases)
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── App Android (APK para download no GitHub Releases) ──
  # Builda o APK com o MESMO código web (Capacitor) e anexa ao mesmo Release
  # criado pelo job `release` acima — o celular baixa direto em Releases.
  # 100% online: o jogo no Android fala com o backend do Vercel igual ao site.
  android:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Garante a platform + build-tools do compileSdk (Capacitor 8 = SDK 36) —
      # no-op quando o runner já vem com tudo instalado.
      - name: Garantir Android SDK (platform 36)
        shell: bash
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - run: npm ci

      - run: npm run content:export

      - run: npx vite build

      # Keystore de assinatura via secrets (OPCIONAL). Com ele sai um APK
      # release ASSINADO (instala sem aviso de fabricante desconhecido); sem ele,
      # sai um APK debug (instalável mesmo assim, para testes).
      # Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      #          ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
      - name: Preparar keystore (se configurado)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PRESENT=true" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "KEYSTORE_PRESENT=false" >> "$GITHUB_ENV"
          fi

      - run: npx cap sync android

      - name: Build APK (release assinado ou debug)
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          KEYSTORE_PRESENT: ${{ env.KEYSTORE_PRESENT }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="${TAG_NAME#v}"          # v1.4.3 → 1.4.3
          CODE="$(echo "$VERSION" | tr -d '.')"  # 1.4.3 → 143
          cd android
          if [ "$KEYSTORE_PRESENT" = "true" ]; then
            ./gradlew assembleRelease -PversionName="$VERSION" -PversionCode="$CODE"
          else
            ./gradlew assembleDebug -PversionName="$VERSION" -PversionCode="$CODE"
          fi

      - name: Anexar APK ao GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PRESENT: ${{ env.KEYSTORE_PRESENT }}
        run: |
          if [ "$KEYSTORE_PRESENT" = "true" ]; then
            APK="$(ls android/app/build/outputs/apk/release/*.apk | head -1)"
          else
            APK="$(ls android/app/build/outputs/apk/debug/*.apk | head -1)"
          fi
          gh release upload "${{ github.ref_name }}" "$APK" --repo "${{ github.repository }}" --clobber
