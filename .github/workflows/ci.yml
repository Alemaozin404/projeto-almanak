name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *' # diariamente 08:00 UTC — verifica o backend mesmo sem push

jobs:
  ci:
    # a checagem agendada só monitora o backend; não precisa rodar testes de novo
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm ci --prefix server
        name: Dependências do servidor (os testes importam o Express real)

      - run: npm run content:export
        name: Gerar server/content.json (paridade com o jogo)

      - run: npm run typecheck
        name: Typecheck

      - run: npm run lint
        name: Lint

      # Suíte dedicada do sistema de contas (registro, login e RESTAURAÇÃO do
      # save ao logar em outro dispositivo) — roda por nome em todo push/PR para
      # sinalizar regressão nessa área de forma explícita e rápida, independente
      # do glob padrão do vitest (o npm test completo continua rodando depois).
      # glob account*.test.ts: futuros testes de conta entram aqui sem editar o CI
      - run: npx vitest run tests/account*.test.ts
        name: Testes da conta e restauração do save

      - run: npm test
        name: Testes completos

      - run: git diff --exit-code server/content.json
        name: Conteúdo exportado em dia (sem diffs pendentes)

  # Monitora o backend de PRODUÇÃO: a cada push, manualmente ou diariamente.
  # Se qualquer variável de ambiente (MP token, Upstash, APP_SHARED_SECRET) ou
  # rota (health/heartbeat/save/online) regredir, o CI fica vermelho.
  check-env:
    if: github.event_name != 'pull_request' # PRs não deployam — não testam produção
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # URL padrão = GameConfig.wallet.backendUrl; sobrescreva com a variável
      # CHECK_ENV_URL (Settings → Variables) se o deploy estiver em outro domínio.
      - run: node scripts/check-env.mjs ${{ vars.CHECK_ENV_URL }}
        name: Verifica backend de produção (health/heartbeat/Upstash)
