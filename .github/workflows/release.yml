name: Release

# Publica uma nova versão do app automaticamente:
#   1. Rode `npm version patch|minor|major` (atualiza package.json e cria tag v*)
#   2. `git push --tags`
#   3. Este workflow builda o instalador Windows e cria um GitHub Release.
#   4. O auto-update do jogo (electron-updater) encontra e instala a nova versão.
#
# Importante: o repositório precisa ser PÚBLICO (ou o app precisa de GH_TOKEN
# nas variáveis do app para acessar releases privados).

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    # Necessário: o electron-builder publica o instalador + latest.yml no
    # GitHub Releases. Sem esta permissão o GITHUB_TOKEN padrão é read-only
    # e a publicação falha com "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run content:export

      - run: npm run build

      # O electron-builder cria releases DRAFT por padrão e, se já existir um
      # draft para a tag, REUSA e mantém como draft — o auto-update não vê.
      # Deletamos o release anterior da tag (mantendo a tag) para garantir um
      # release PUBLICADO novo (releaseType: release no package.json).
      # shell: bash explícito — o padrão no Windows é o PowerShell, onde o
      # operador `||` não captura exit code de comando externo (o fallback
      # "sem release anterior" nunca rodava e o passo falhava na 1ª release
      # da tag, quando não há o que deletar).
      - name: Remover release anterior da tag (draft quebrado)
        shell: bash
        run: gh release delete "${{ github.ref_name }}" --repo "${{ github.repository }}" --yes 2>/dev/null || echo 'sem release anterior — ok'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Empacotar e publicar (GitHub Releases)
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
